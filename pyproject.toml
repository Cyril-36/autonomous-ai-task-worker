[project]
name = "task-worker"
version = "0.1.0"
description = "Autonomous AI task worker operating a real browser across sandbox company apps"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "sandbox"]
