[project]
name = "task-worker"
version = "0.1.0"
description = "Autonomous AI task worker operating a real browser across sandbox company apps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142.2",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "openai>=3.24.0",
  "playwright>=1.63.0",
  "pydantic>=2.8",
  "python-dotenv>=1.2.4",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "sse-starlette>=3.5.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "sandbox"]
